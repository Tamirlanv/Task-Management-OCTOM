name: API checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: taskman
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: taskman_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U taskman -d taskman_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run black --check .
      - run: uv run mypy app tests scripts
      - run: uv run pytest --cov=app --cov-report=term-missing --cov-report=xml
      - name: Branch coverage report
        run: uv run pytest --cov=app --cov-branch --cov-fail-under=0 --cov-report=xml:coverage-branches.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage*.xml
