[project]
name = "task-management-api"
version = "0.1.0"
description = "Workspace-based task management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "argon2-cffi>=23.1,<26",
    "PyJWT>=2.10,<3",
    "redis>=5.2,<7",
    "email-validator>=2.2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "httpx>=0.28,<1",
    "asgi-lifespan>=2.1,<3",
    "ruff>=0.9,<1",
    "black>=25.1,<27",
    "mypy>=1.15,<2",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires isolated PostgreSQL and Redis services"]

[tool.coverage.run]
source = ["app"]
branch = false
core = "sysmon"

[tool.coverage.report]
fail_under = 80
show_missing = true
